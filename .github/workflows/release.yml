name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          rebar3-version: "3"
      - name: Install nats-server
        run: |
          version=2.11.6
          archive="nats-server-v${version}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/nats-io/nats-server/releases/download/v${version}/${archive}" \
            --output /tmp/nats-server.tar.gz
          checksum=$(curl --fail --silent --show-error --location \
            "https://github.com/nats-io/nats-server/releases/download/v${version}/SHA256SUMS" \
            | awk -v name="${archive}" '$2 == name {print $1}')
          test -n "$checksum"
          echo "$checksum  /tmp/nats-server.tar.gz" | sha256sum --check
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          echo "/tmp/nats-server-v${version}-linux-amd64" >> "$GITHUB_PATH"
      - name: Check release version
        run: |
          tag="$(git describe --tags --exact-match)"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(sed -n 's/.*{vsn, \"\([^\"]*\)\"}.*/\1/p' src/enats_client.app.src)"
          changelog="$(sed -n 's/^## \(.*\)$/\1/p' CHANGELOG.md | head -1)"
          test "$tag" = "$version"
          test "$tag" = "$changelog"
      - run: make release_checks
      - run: rebar3 hex build
      - run: rebar3 hex publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$(git describe --tags --exact-match)" --generate-notes
